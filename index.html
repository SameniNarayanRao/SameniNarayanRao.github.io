<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Child Malnutrition Prediction</title>
    <style>
        body {
            background: linear-gradient(135deg, #F0F8FF 0%, #ADD8E6 100%);
            font-family: Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header-img { width: 100%; height: 300px; object-fit: cover; }
        .logo { max-width: 500px; height: 280px; display: block; margin: 20px auto; }
        .form-section {
            padding: 40px;
            text-align: center;
        }
        .form-title { 
            font-size: 2.5em; 
            color: #1e3a8a; 
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .form-note {
            font-size: 1.1em;
            color: #374151;
            margin-bottom: 30px;
            font-style: italic;
        }
        .form-container {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #1e40af;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }
        .predict-btn {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .predict-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }
        .results {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .marquee {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            font-style: italic;
            font-size: 1.1em;
            margin: 20px 0;
            border-radius: 10px;
        }
        footer {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            text-align: center;
            margin-top: 40px;
        }
        .status-sam { color: #dc2626; background: rgba(220,38,38,0.1); }
        .status-mam, .status-overweight { color: #ea580c; background: rgba(234,88,12,0.1); }
        .status-normal { color: #16a34a; background: rgba(22,163,74,0.1); }
        .status-obesity { color: #b91c1c; background: rgba(185,28,28,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <center><img src="prediction2.gif" class="header-img" alt="Prediction Banner"></center>
        
        <table style="width:100%">
            <tr>
                <td style="width:50%; vertical-align:top;">
                    <center><img src="LOGO1.jpg" class="logo" alt="Organization Logo"></center>
                </td>
                <td style="width:50%; vertical-align:middle;">
                    <div class="form-section">
                        <h1 class="form-title">Enter Child Details</h1>
                        <h2 class="form-note">(Enter 0 for Age if child is less than 1 month)</h2>
                        
                        <form id="predictionForm" class="form-container">
                            <div class="form-group">
                                <label>Age of Child (months)</label>
                                <input type="number" id="age" step="0.1" min="0" placeholder="e.g., 12.5">
                            </div>
                            <div class="form-group">
                                <label>Sex (Male=1, Female=2)</label>
                                <input type="number" id="sex" min="1" max="2" placeholder="1 or 2">
                            </div>
                            <div class="form-group">
                                <label>Height (cm)</label>
                                <input type="number" id="height" step="0.1" placeholder="e.g., 85.5">
                            </div>
                            <div class="form-group">
                                <label>Weight (kg)</label>
                                <input type="number" id="weight" step="0.1" placeholder="e.g., 12.3">
                            </div>
                            <button type="submit" class="predict-btn">🔍 Predict Nutrition Status</button>
                        </form>
                        
                        <div id="results" style="display:none;"></div>
                    </div>
                </td>
            </tr>
        </table>
        
        <div class="marquee">
            India contributes a third of global undernutrition burden - 25.5M wasted children worldwide.
        </div>
    </div>

    <footer>
        <h2 style="font-size:1.2em; margin-bottom:20px;">
            Refer: <a href="https://www.who.int/tools/child-growth-standards/standards/weight-for-length-height" 
                     style="color:#60a5fa;">WHO Child Growth Charts</a> | 
            <a href="https://www.fantaproject.org/sites/default/files/download/Calculate-WHZ-2.6-NACS-Users-Guide-Apr2016.pdf" 
               style="color:#60a5fa;">Weight-for-Height Z-Score Chart</a>
        </h2>
        <p>Developed by Narayan Rao Sameni</p>
    </footer>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const age = parseFloat(document.getElementById('age').value) || 0;
            const sex = parseInt(document.getElementById('sex').value) || 0;
            const height = parseFloat(document.getElementById('height').value) || 0;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            
            if (!height || !weight) {
                alert('Please enter Height and Weight');
                return;
            }
            
            // WHO Weight-for-Height Z-Score calculation (simplified)
            // Replace with your exact formula/reference tables
            const medianWeight = getMedianWeightForHeight(height);
            const whz = (weight - medianWeight) / getStandardDeviation(height);
            const status = getNutritionStatus(whz);
            
            showResult(status, whz);
        });

        function getMedianWeightForHeight(height) {
            // Simplified WHO median weight-for-height (0-5 years)
            // Replace with actual WHO lookup table values
            if (height < 50) return 2.5;
            if (height < 60) return 3.8;
            if (height < 70) return 5.5;
            if (height < 80) return 7.5;
            if (height < 90) return 9.8;
            if (height < 100) return 12.5;
            return 15.0; // Placeholder
        }

        function getStandardDeviation(height) {
            // Simplified SD values - replace with WHO table
            return 1.2;
        }

        function getNutritionStatus(whz) {
            if (whz < -3) return {code: 1, name: 'Severe Acute Malnutrition (SAM)', range: '< -3'};
            if (whz >= -3 && whz < -2) return {code: 2, name: 'Moderate Acute Malnutrition (MAM)', range: '≥ -3 to < -2'};
            if (whz >= -2 && whz <= 2) return {code: 3, name: 'Normal', range: '≥ -2 to ≤ +2'};
            if (whz > 2 && whz <= 3) return {code: 4, name: 'Overweight', range: '> +2 to ≤ +3'};
            return {code: 5, name: 'Obesity', range: '> +3'};
        }

        function showResult(status, whz) {
            const resultsDiv = document.getElementById('results');
            const colors = {
                1: 'status-sam', 2: 'status-mam', 3: 'status-normal', 
                4: 'status-overweight', 5: 'status-obesity'
            };
            
            resultsDiv.innerHTML = `
                <div class="results ${colors[status.code]}">
                    <h1 style="font-size:3em; margin-bottom:10px;">${status.name}</h1>
                    <h2 style="font-size:1.5em; margin-bottom:20px;">Z-Score: ${whz.toFixed(2)} ${status.range}</h2>
                    <img src="${status.code <= 3 ? 'happy.gif' : 'unhappy.gif'}" style="max-height:150px;">
                </div>
            `;
            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({behavior: 'smooth'});
        }
    </script>
</body>
</html>
